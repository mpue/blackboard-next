[package]
name = "blackboard"
version = "3.0.2"
description = "BlackBoard Circuit Designer"
authors = ["Matthias Püski <blackboard@pueski.de>"]
license = "AGPL-3.0-only"
publish = false
edition = "2021"
rust-version = "1.77"

[lib]
name = "blackboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
strip = true
