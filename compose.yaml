# docker compose up -d --build
#
# The app on 127.0.0.1:8080 (for a reverse proxy on the same host), the
# account server behind it and the C/C++ compiler behind that (no network
# access, only the API reaches it). Secrets go into server.env next to this file (see
# server/.env.example); the settings under `environment` take precedence.
services:
  blackboard:
    build:
      context: .
      target: web
    image: blackboard-next:latest
    restart: unless-stopped
    environment:
      API_URL: http://api:8787
    # only reachable from the host; publish it through the reverse proxy
    ports:
      - "127.0.0.1:8080:8080"
    depends_on:
      - api
  api:
    build:
      context: .
      target: api
    image: blackboard-api:latest
    restart: unless-stopped
    env_file:
      - path: server.env
        required: false
    environment:
      ORIGIN: http://localhost:8080
      PUBLIC_PATH: ""
      COMPILER_URL: http://compiler:8789
    volumes:
      - data:/data
    networks:
      - default
      - compile
  # compiles code from the web: nothing secret inside, no way out, small limits
  compiler:
    build:
      context: .
      target: compiler
    image: blackboard-compiler:latest
    restart: unless-stopped
    read_only: true
    tmpfs:
      - /tmp:size=512m,mode=1777,noexec,nosuid
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    pids_limit: 256
    mem_limit: 1g
    cpus: 2
    networks:
      - compile

networks:
  compile:
    internal: true

volumes:
  data:
